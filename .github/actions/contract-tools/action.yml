name: Install contract tools
description: Install the pinned Bun runtime and verified official oasdiff binary.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - name: Install official oasdiff 1.35.0
      shell: bash
      run: |
        directory="$RUNNER_TEMP/oasdiff"
        mkdir -p "$directory"
        curl --fail --silent --show-error --location \
          https://github.com/oasdiff/oasdiff/releases/download/v1.35.0/oasdiff_1.35.0_linux_amd64.tar.gz \
          --output "$directory/oasdiff.tar.gz"
        printf '%s  %s\n' a8023002fcb2eaa7f5758148a9303cb63d33b939886df312268bc0fc7b939140 "$directory/oasdiff.tar.gz" | sha256sum --check
        tar -xzf "$directory/oasdiff.tar.gz" -C "$directory"
        "$directory/oasdiff" --version
        printf '%s\n' "$directory" >> "$GITHUB_PATH"
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
