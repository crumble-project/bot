name: Install contract tools
description: Install the pinned Bun runtime and verified official oasdiff binary.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.2
    - name: Install official oasdiff 1.34.0
      shell: bash
      run: |
        directory="$RUNNER_TEMP/oasdiff"
        mkdir -p "$directory"
        curl --fail --silent --show-error --location \
          https://github.com/oasdiff/oasdiff/releases/download/v1.34.0/oasdiff_1.34.0_linux_amd64.tar.gz \
          --output "$directory/oasdiff.tar.gz"
        printf '%s  %s\n' 7c88e09fd500b231af2819eb21f6fdfc7bcdfe2741d2c1937c59e7b72c8a575a "$directory/oasdiff.tar.gz" | sha256sum --check
        tar -xzf "$directory/oasdiff.tar.gz" -C "$directory"
        "$directory/oasdiff" --version
        printf '%s\n' "$directory" >> "$GITHUB_PATH"
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
