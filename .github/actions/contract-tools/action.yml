name: Install contract tools
description: Install the pinned Bun runtime and verified official oasdiff binary.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.4.4
    - name: Install official oasdiff 1.34.1
      shell: bash
      run: |
        directory="$RUNNER_TEMP/oasdiff"
        mkdir -p "$directory"
        curl --fail --silent --show-error --location \
          https://github.com/oasdiff/oasdiff/releases/download/v1.34.1/oasdiff_1.34.1_linux_amd64.tar.gz \
          --output "$directory/oasdiff.tar.gz"
        printf '%s  %s\n' 75775f65b0adebd26a8e013af51a799342dfdc6262d89efa9e3b7bdf89657d90 "$directory/oasdiff.tar.gz" | sha256sum --check
        tar -xzf "$directory/oasdiff.tar.gz" -C "$directory"
        "$directory/oasdiff" --version
        printf '%s\n' "$directory" >> "$GITHUB_PATH"
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
