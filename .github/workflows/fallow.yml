name: Fallow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The audit compares against the base commit, so it needs the history.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Only findings this change introduces fail; the repository's older ones are reported as inherited.
      - run: bunx fallow audit --base "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
