name: Docs

on:
  pull_request:
    paths: ["apps/docs/**", ".github/workflows/docs.yml"]
  push:
    branches: [main]
    paths: ["apps/docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # --bun runs Blume's node shebang on Bun, so the job needs no Node setup.
      - run: bun --bun run check
      - run: bun --bun run build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Queue deploys so an older commit never finishes after a newer one.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      # Wrangler supports Node, not Bun, so it runs on its node shebang.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun --bun run build
      - run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
