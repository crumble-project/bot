name: API contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/contract-tools
      - run: bun run check
      - run: bun run contract:validate
      - name: Validate HTTP document with oasdiff
        run: oasdiff validate openapi/openapi.json --allow-external-refs=false
      - name: Check out pull request base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .contract-base
          sparse-checkout: openapi
          persist-credentials: false
      - name: Check compatibility with the pull request base
        if: github.event_name == 'pull_request'
        run: bun run contract:compatibility .contract-base/openapi
      - name: Preserve compatibility reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-compatibility
          path: contract-reports/
          if-no-files-found: ignore
